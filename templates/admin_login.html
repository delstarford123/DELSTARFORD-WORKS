<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Access | Delstarford Works</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; height: 100vh; background: #0f172a; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; color: white; overflow: hidden; }
        
        .login-box { width: 100%; max-width: 400px; padding: 40px; background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; backdrop-filter: blur(10px); border-radius: 12px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .icon-lock { font-size: 3rem; color: #ef4444; margin-bottom: 20px; }
        h2 { margin: 0 0 10px 0; letter-spacing: -1px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; background: #020617; border: 1px solid #1e293b; color: white; border-radius: 6px; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        
        .alert { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 20px; display: none; text-align: left; border-left: 4px solid #ef4444; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon-lock"><i class="fas fa-fingerprint"></i></div>
        <h2>Admin Authentication</h2>
        <p>Restricted Area. Authorized Personnel Only.</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert" style="display: block;">
                <i class="fas fa-exclamation-circle"></i> {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form action="/admin-login-submit" method="POST">
            <div class="form-group">
                <label>Admin ID (Email)</label>
                <input type="email" name="email" required placeholder="admin@delstarford.com">
            </div>
            <div class="form-group">
                <label>Secure Passphrase</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Verify & Access</button>
        </form>
    </div>
</body>
</html>
