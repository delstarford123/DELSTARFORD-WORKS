{% extends 'base.html' %}
{% block content %}

<style>
    /* --- CSS VARIABLES --- */
    :root {
        --reg-primary: #3b82f6;
        --reg-primary-hover: #2563eb;
        --reg-dark: #0f172a;
        --reg-bg: #f8fafc;
        --reg-card: #ffffff;
        --reg-border: #e2e8f0;
        --reg-text: #334155;
        --reg-muted: #64748b;
        --reg-success: #10b981;
        --reg-danger: #ef4444;
    }

    body { background: var(--reg-bg); font-family: 'Plus Jakarta Sans', sans-serif; }

    /* --- LAYOUT --- */
    .reg-section { 
        min-height: calc(100vh - 80px); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        background-color: var(--reg-bg);
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 40px 40px;
        padding: 60px 20px; 
        box-sizing: border-box; 
    }
    
    .reg-card { 
        background: var(--reg-card); 
        padding: 50px 45px; 
        border-radius: 24px; 
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15), 0 0 0 1px rgba(15, 23, 42, 0.05); 
        width: 100%; 
        max-width: 520px; 
        box-sizing: border-box; 
        border-top: 6px solid var(--reg-primary);
    }
    
    /* --- HEADER --- */
    .reg-header { text-align: center; margin-bottom: 40px; }
    .reg-logo { height: 50px; margin-bottom: 20px; }
    .reg-header h2 { font-size: 2.2rem; color: var(--reg-dark); margin: 0 0 10px 0; font-weight: 800; letter-spacing: -1px;}
    .reg-header p { color: var(--reg-muted); font-size: 1rem; margin: 0; font-weight: 500; line-height: 1.5;}
    
    /* --- FORM --- */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { margin-bottom: 22px; width: 100%; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 800; color: var(--reg-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .input-wrapper { 
        display: flex; align-items: center; background: #f1f5f9; border: 1px solid var(--reg-border); 
        border-radius: 10px; padding: 0 16px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; box-sizing: border-box; 
    }
    .input-wrapper:focus-within { border-color: var(--reg-primary); background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
    
    .input-icon { color: #94a3b8; margin-right: 12px; font-size: 1rem; transition: 0.3s; width: 18px; text-align: center;}
    .input-wrapper:focus-within .input-icon { color: var(--reg-primary); }
    
    .input-wrapper input { 
        width: 100%; border: none; background: transparent; padding: 14px 0; 
        outline: none; color: var(--reg-dark); font-size: 0.95rem; font-family: inherit; font-weight: 600;
    }
    .input-wrapper input::placeholder { color: #94a3b8; font-weight: 400;}

    /* Password Toggle */
    .toggle-pass { 
        background: none; border: none; color: #94a3b8; cursor: pointer; 
        padding: 0 10px; font-size: 1.1rem; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        outline: none; display: flex; align-items: center; justify-content: center;
    }
    .toggle-pass:hover { color: var(--reg-primary); transform: scale(1.1); }
    .toggle-pass:active { transform: scale(0.9); }
    
    /* --- BUTTON --- */
    .btn-register {
        background: var(--reg-primary);
        color: #ffffff; width: 100%; padding: 16px; border: none; border-radius: 12px;
        font-weight: 800; font-size: 1rem; letter-spacing: 0.5px; cursor: pointer; text-transform: uppercase;
        display: flex; justify-content: center; align-items: center; gap: 12px; transition: all 0.3s;
        margin-top: 25px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.25);
    }
    .btn-register:hover { background: var(--reg-primary-hover); transform: translateY(-2px); box-shadow: 0 15px 30px rgba(59, 130, 246, 0.35); }
    .btn-register:disabled { background: var(--reg-muted); cursor: not-allowed; transform: none; box-shadow: none; }

    /* --- FEEDBACK --- */
    .reg-alert { 
        padding: 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; margin-top: 20px; display: none; text-align: center;
    }
    .reg-alert.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .reg-alert.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

    .reg-footer { text-align: center; margin-top: 35px; font-size: 0.95rem; color: var(--reg-muted); border-top: 1px solid var(--reg-border); padding-top: 25px; font-weight: 500;}
    .reg-footer a { color: var(--reg-primary); font-weight: 800; text-decoration: none; transition: 0.2s;}
    .reg-footer a:hover { color: var(--reg-dark); text-decoration: underline;}
    
    .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; display: none; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media (max-width: 600px) { 
        .reg-card { padding: 40px 25px; } 
        .form-grid { grid-template-columns: 1fr; gap: 0; }
        .form-group.full-width { grid-column: auto; }
        .reg-header h2 { font-size: 1.8rem; }
    }
</style>

<section class="reg-section">
    <div class="reg-card gsap-anim" style="visibility: hidden;">
        
        <div class="reg-header">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DW Logo" class="reg-logo gsap-stagger">
            <h2 class="gsap-stagger">Create Account</h2>
            <p class="gsap-stagger">Join the Delstarford Works network today and start engineering your future.</p>
            <p class="gsap-stagger" style="margin-top: 15px; font-size: 0.9rem; color: var(--reg-muted);">
                Applying for an expert or partner role? <a href="/register" style="color: var(--reg-primary); font-weight: 800; text-decoration: none;">Apply here</a>
            </p>
        </div>

        <form id="generalRegisterForm">
            <div class="form-group full-width gsap-stagger">
                <label>Full Legal Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="reg-name" placeholder="Isaiah Delstarford" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group gsap-stagger">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="reg-email" placeholder="name@domain.com" required>
                    </div>
                </div>

                <div class="form-group gsap-stagger">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="reg-phone" placeholder="07XX XXX XXX" required>
                    </div>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group gsap-stagger">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-pass" onclick="togglePass('reg-password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group gsap-stagger">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-alt input-icon"></i>
                        <input type="password" id="reg-confirm" placeholder="••••••••" required>
                        <button type="button" class="toggle-pass" onclick="togglePass('reg-confirm', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register gsap-stagger" id="regBtn">
                <span id="btn-text">Register Account</span>
                <i class="fas fa-user-plus" id="btn-icon"></i>
                <div class="spinner" id="btn-spinner"></div>
            </button>
            
            <div id="reg-alert" class="reg-alert"></div>
        </form>

        <div class="reg-footer gsap-stagger">
            <p>Already have an account? <a href="/login">Secure Login</a></p>
        </div>
    </div>
</section>

<script>
    // --- GSAP ANIMATIONS ---
    document.addEventListener("DOMContentLoaded", () => {
        if(typeof gsap === 'undefined') {
            document.querySelector('.gsap-anim').style.visibility = 'visible';
            return;
        }

        const tl = gsap.timeline();
        tl.fromTo(".gsap-anim", 
            { y: 30, autoAlpha: 0, scale: 0.98 }, 
            { y: 0, autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }
        )
        .fromTo(".gsap-stagger", 
            { y: 15, autoAlpha: 0 }, 
            { y: 0, autoAlpha: 1, stagger: 0.08, duration: 0.5, ease: "power2.out" }, 
            "-=0.4"
        );
    });

    // --- FORM LOGIC ---
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    document.getElementById('generalRegisterForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const phone = document.getElementById('reg-phone').value;
        const password = document.getElementById('reg-password').value;
        const confirm = document.getElementById('reg-confirm').value;
        
        const alert = document.getElementById('reg-alert');
        const btn = document.getElementById('regBtn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const spinner = document.getElementById('btn-spinner');

        // Validation
        if (password !== confirm) {
            showAlert("Passwords do not match.", "error");
            return;
        }
        if (password.length < 6) {
            showAlert("Password must be at least 6 characters.", "error");
            return;
        }

        // Loading State
        setLoading(true);

        try {
            // 1. Firebase Authentication Create User
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // 2. Store Additional Data in Realtime DB (Using JS SDK syntax db.ref, NOT db.reference)
            await db.ref('users/' + user.uid).set({
                full_name: name,
                email: email,
                phone: phone,
                role: 'Client', // Default role
                status: 'Active',
                created_at: new Date().toISOString()
            });

            // 3. Optional: Notify Backend (for emails, logs, etc.)
            await fetch('/submit-general-registration', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone, uid: user.uid })
            });

            showAlert("Account created successfully! Redirecting...", "success");
            
            setTimeout(() => {
                window.location.href = "/dashboard";
            }, 1500);

        } catch (error) {
            console.error(error);
            // Handle specific Firebase auth errors for better UX
            let errorMsg = error.message;
            if (error.code === 'auth/email-already-in-use') {
                errorMsg = "This email is already registered. Please log in or use a different email.";
            } else if (error.code === 'auth/weak-password') {
                errorMsg = "Your password is too weak. Please use at least 6 characters.";
            }
            showAlert(errorMsg, "error");
            setLoading(false);
        }
    };

    function showAlert(msg, type) {
        const alert = document.getElementById('reg-alert');
        alert.textContent = msg;
        alert.className = `reg-alert ${type}`;
        alert.style.display = 'block';
        if(typeof gsap !== 'undefined') {
            gsap.fromTo(alert, {y: 10, autoAlpha: 0}, {y: 0, autoAlpha: 1, duration: 0.3});
        }
    }

    function setLoading(isLoading) {
        const btn = document.getElementById('regBtn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const spinner = document.getElementById('btn-spinner');
        
        btn.disabled = isLoading;
        if (isLoading) {
            btnText.textContent = "Creating Account...";
            btnIcon.style.display = 'none';
            spinner.style.display = 'block';
        } else {
            btnText.textContent = "Register Account";
            btnIcon.style.display = 'block';
            spinner.style.display = 'none';
        }
    }
</script>

{% endblock %}
