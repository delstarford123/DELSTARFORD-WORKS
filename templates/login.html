{% extends 'base.html' %}
{% block content %}

<section class="auth-section">
    <div class="auth-card" id="login-container">
        
        <div class="auth-header">
            <img src="{{ url_for('static', filename='images/DEL SVG.svg') }}" alt="DW Logo" class="auth-logo">
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access the terminal.</p>
        </div>

        <form id="loginForm" class="advanced-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">
                <span id="btn-text">Secure Login</span> <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
            </button>
            
            <p id="error-msg" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; font-weight: 600;"></p>
        </form>

        <div class="auth-footer">
            <p>New to Delstarford Works? <a href="/register2">Create an Account</a></p>
        </div>
    </div>
</section>

<script>
    // --- FIREBASE LOGIN LOGIC ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const btnText = document.getElementById('btn-text');
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('error-msg');

        try {
            btnText.innerText = "Authenticating...";
            btn.disabled = true;
            errorMsg.style.display = "none";

            // Firebase Login
            await firebase.auth().signInWithEmailAndPassword(email, password);
            
            btnText.innerText = "Access Granted";
            btn.style.background = "#10b981"; // Turn green
            
            // Redirect to Dashboard
            setTimeout(() => {
                window.location.href = "/dashboard";
            }, 500);
            
        } catch (error) {
            console.error(error);
            btnText.innerText = "Secure Login";
            btn.disabled = false;
            errorMsg.innerText = "Access Denied: Invalid email or password.";
            errorMsg.style.display = "block";
        }
    });
</script>

<style>
    .auth-section { min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; background: #f8fafc; padding: 40px 20px; box-sizing: border-box; }
    .auth-card { background: white; padding: 50px 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1); border: 1px solid #e2e8f0; width: 100%; max-width: 450px; box-sizing: border-box; }
    .auth-header { text-align: center; margin-bottom: 35px; }
    .auth-logo { height: 50px; margin-bottom: 20px; }
    .auth-header h2 { font-size: 1.8rem; color: #0f172a; margin: 0 0 5px 0; font-weight: 800; }
    .auth-header p { color: #64748b; font-size: 0.95rem; margin: 0; }
    
    .form-group { margin-bottom: 20px; width: 100%; box-sizing: border-box; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-wrapper { display: flex; align-items: center; background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 10px; padding: 0 15px; transition: all 0.3s ease; width: 100%; box-sizing: border-box; }
    .input-wrapper:focus-within { border-color: #2563eb; background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .input-wrapper i { color: #94a3b8; margin-right: 12px; font-size: 1.1rem; }
    .input-wrapper input { width: 100%; border: none; background: transparent; padding: 14px 0; outline: none; color: #0f172a; font-size: 1rem; font-family: inherit; }
    
    /* THE MISSING BUTTON FIX */
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        color: #ffffff; width: 100%; padding: 16px; border: none; border-radius: 12px;
        font-weight: 800; font-size: 1.05rem; letter-spacing: 0.5px; cursor: pointer;
        display: flex; justify-content: center; align-items: center; transition: all 0.4s ease;
        margin-top: 25px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.6); }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

    .auth-footer { text-align: center; margin-top: 30px; font-size: 0.95rem; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    .auth-footer a { color: #2563eb; font-weight: 700; text-decoration: none; }
    
    @media (max-width: 500px) { .auth-card { padding: 30px 20px; border-radius: 16px; } .auth-header h2 { font-size: 1.5rem; } }
</style>
{% endblock %}
