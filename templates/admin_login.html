{% extends 'base.html' %}
{% block content %}

<style>
    /* Hide public UI elements for the secure admin portal */
    .site-header, .site-footer { display: none !important; }
    
    /* Clean Enterprise Theme */
    body { 
        background: #f1f5f9 !important; 
        overflow: hidden; 
        font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    /* Subtle Grid Background */
    body::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 30px 30px; opacity: 0.5; z-index: -1;
    }

    .admin-auth-section { 
        min-height: 100vh; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px;
    }
    
    .admin-auth-card { 
        background: #ffffff; 
        border: 1px solid #e2e8f0; 
        padding: 50px 40px; 
        border-radius: 16px; 
        width: 100%; 
        max-width: 440px; 
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(59, 130, 246, 0.05); 
        position: relative; 
        overflow: hidden;
    }

    /* Soft Blue Scanline */
    .scanline {
        position: absolute; top: 0; left: 0; width: 100%; height: 3px;
        background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.8), transparent); 
        animation: scan 3s linear infinite; 
        opacity: 0.5; 
        pointer-events: none;
    }
    @keyframes scan { 0% { top: -10px; } 100% { top: 110%; } }

    .admin-header { text-align: center; margin-bottom: 40px; }
    
    .shield-icon { 
        font-size: 3.5rem; 
        color: #3b82f6; 
        margin-bottom: 15px; 
        filter: drop-shadow(0 4px 10px rgba(59, 130, 246, 0.3)); 
    }
    
    .admin-header h2 { 
        color: #0f172a; 
        font-size: 1.8rem; 
        margin: 0 0 8px; 
        font-weight: 800; 
        letter-spacing: -0.5px; 
    }
    
    .admin-header p { 
        color: #64748b; 
        font-size: 0.9rem; 
        margin: 0; 
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .form-group { margin-bottom: 25px; }
    .form-group label { 
        display: block; 
        color: #475569; 
        font-size: 0.8rem; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        margin-bottom: 8px; 
        font-weight: 700; 
    }
    
    .input-wrapper-light { 
        display: flex; 
        align-items: center; 
        background: #f8fafc; 
        border: 1px solid #e2e8f0; 
        border-radius: 8px; 
        padding: 0 15px; 
        transition: all 0.3s ease; 
    }
    .input-wrapper-light:focus-within { 
        border-color: #3b82f6; 
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
        background: #ffffff;
    }
    
    .input-wrapper-light i { 
        color: #94a3b8; 
        margin-right: 12px; 
        font-size: 1.1rem;
        transition: color 0.3s ease;
    }
    .input-wrapper-light:focus-within i { color: #3b82f6; }
    
    .input-wrapper-light input { 
        width: 100%; 
        background: transparent; 
        border: none; 
        padding: 15px 0; 
        color: #0f172a; 
        font-size: 1rem; 
        outline: none; 
        font-family: inherit; 
        font-weight: 500;
    }
    .input-wrapper-light input::placeholder { color: #94a3b8; font-weight: 400; }
    
    .btn-admin-submit { 
        width: 100%; 
        background: #3b82f6; 
        color: white; 
        border: none; 
        padding: 15px; 
        border-radius: 8px; 
        font-size: 1.05rem; 
        font-weight: 700; 
        letter-spacing: 0.5px; 
        cursor: pointer; 
        transition: all 0.3s ease; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        margin-top: 35px;
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }
    .btn-admin-submit:hover { 
        background: #2563eb; 
        transform: translateY(-2px); 
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); 
    }
    .btn-admin-submit:disabled { 
        background: #cbd5e1; 
        color: #ffffff; 
        cursor: not-allowed; 
        box-shadow: none; 
        transform: none;
    }
    
    .admin-error { 
        background: #fee2e2; 
        color: #b91c1c; 
        border: 1px solid #fecaca; 
        padding: 12px; 
        font-size: 0.85rem; 
        text-align: center; 
        margin-top: 20px; 
        display: none; 
        border-radius: 8px; 
        font-weight: 600;
    }
</style>

<section class="admin-auth-section">
    <div class="admin-auth-card gsap-admin-card">
        
        <div class="scanline"></div>

        <div class="admin-header">
            <i class="fas fa-shield-alt shield-icon"></i>
            <h2 id="admin-title">System Authorization</h2>
            <p class="fade-element">Command Center</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group fade-element">
                <label>Admin ID (Email)</label>
                <div class="input-wrapper-light">
                    <i class="fas fa-user-shield"></i>
                    <input type="email" id="admin-email" placeholder="admin_email@gmail.com" required autofocus>
                </div>
            </div>

            <div class="form-group fade-element">
                <label>Secure Passphrase</label>
                <div class="input-wrapper-light">
                    <i class="fas fa-key"></i>
                    <input type="password" id="admin-password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-admin-submit fade-element" id="adminBtn">
                <span id="btn-text">Authenticate</span> 
                <i class="fas fa-arrow-right" style="margin-left: 10px;"></i>
            </button>
            
            <p id="error-msg" class="admin-error"></p>
        </form>
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(typeof gsap !== 'undefined') {
            const tl = gsap.timeline();
            
            tl.from(".gsap-admin-card", { scale: 0.95, y: 40, opacity: 0, duration: 0.8, ease: "power3.out" })
              .fromTo("#admin-title", { text: "" }, { text: { value: "System Authorization", chars: "█▓▒░XO!#" }, duration: 1.2, ease: "none" }, "-=0.4")
              .from(".fade-element", { y: 20, opacity: 0, stagger: 0.1, duration: 0.5, ease: "power2.out" }, "-=0.5");
              
            gsap.to(".shield-icon", { scale: 1.05, duration: 1.5, repeat: -1, yoyo: true, ease: "sine.inOut" });
        }
    });

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        const btnText = document.getElementById('btn-text');
        const btn = document.getElementById('adminBtn');
        const errorMsg = document.getElementById('error-msg');

        try {
            btnText.innerText = "Authenticating...";
            btn.disabled = true;
            errorMsg.style.display = "none";

            // 1. Authenticate
            const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // 2. Role Check
            const snapshot = await firebase.database().ref('users/' + user.uid).once('value');
            const userData = snapshot.val();

            if (userData && userData.role === 'admin') {
                btnText.innerText = "Access Granted";
                btn.style.background = "#10b981"; // Success Green
                
                // Success Ping Animation
                if(typeof gsap !== 'undefined') { gsap.to(".gsap-admin-card", { scale: 1.02, duration: 0.2, yoyo: true, repeat: 1 }); }
                
                setTimeout(() => { window.location.href = "/admin-dashboard"; }, 800);
            } else {
                await firebase.auth().signOut();
                throw new Error("Clearance Level Insufficient.");
            }
            
        } catch (error) {
            btnText.innerText = "Authenticate";
            btn.disabled = false;
            errorMsg.innerText = "Error: " + error.message;
            errorMsg.style.display = "block";
            
            // Shake on Failure
            if(typeof gsap !== 'undefined') { gsap.to(".gsap-admin-card", { x: 10, duration: 0.08, yoyo: true, repeat: 5, ease: "sine.inOut" }); }
        }
    });
</script>
{% endblock %}
