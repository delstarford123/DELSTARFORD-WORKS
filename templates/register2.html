{% extends 'base.html' %}
{% block content %}

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<section class="auth-section" style="min-height: 85vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top left, #f1f5f9 0%, #e2e8f0 100%); overflow: hidden; padding: 40px 20px;">
    <div class="auth-card" id="register-container" style="visibility: hidden;">
        
        <div class="auth-header">
            <h2 class="gsap-title">Initialize Account</h2>
            <p class="gsap-subtitle">Join the network to access AI models and tools.</p>
        </div>

        <form id="registerForm" class="advanced-form">
            <div class="form-group gsap-photo" style="text-align: center; margin-bottom: 30px;">
                <label style="display: block; margin-bottom: 12px; font-weight: 700; color: #475569; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px;">Passport Photo</label>
                <div onclick="document.getElementById('reg-photo').click()" class="photo-upload-circle" id="photo-circle">
                    <img id="photo-preview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                    <div id="photo-placeholder" style="text-align: center; color: #94a3b8; transition: color 0.3s;">
                        <i class="fas fa-camera" style="font-size: 1.8rem;"></i>
                    </div>
                </div>
                <input type="file" id="reg-photo" accept="image/*" style="display: none;" onchange="previewImage(this)">
                <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">Click to upload (Max 500KB)</p>
            </div>

            <div class="form-group gsap-input">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
            </div>

            <div class="form-group gsap-input">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group gsap-input">
                <label>Create Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Min. 6 characters" required>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full gsap-btn" id="regBtn">
                <span id="btn-text">Create Account</span> <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
            
            <p id="error-msg" style="color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; font-weight: 600;"></p>
        </form>

        <div class="auth-footer gsap-footer">
            <p>Already have an ID? <a href="/login">Log In</a></p>
        </div>
    </div>
</section>

<script>
    // --- 0. INITIALIZE FIREBASE ---
    // GO TO FIREBASE CONSOLE -> PROJECT SETTINGS -> GENERAL -> SCROLL DOWN TO "YOUR APPS"
    // COPY THE CONFIG OBJECT HERE:
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCdbCJvC2-WdaEMQc_ZGaggqA_-SMf1DYU",
  authDomain: "delstarford-works.firebaseapp.com",
  databaseURL: "https://delstarford-works-default-rtdb.firebaseio.com",
  projectId: "delstarford-works",
  storageBucket: "delstarford-works.firebasestorage.app",
  messagingSenderId: "735702460296",
  appId: "1:735702460296:web:8534ca0b1e86cc6a76bc3d",
  measurementId: "G-DHSQPE2MZW"
};

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    document.addEventListener("DOMContentLoaded", () => {
        if(typeof gsap !== 'undefined') {
            const tl = gsap.timeline();
            gsap.set(".auth-card", { visibility: "visible" });
            tl.from(".auth-card", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out", scale: 0.95 })
              .from(".gsap-title", { y: 15, opacity: 0, duration: 0.4 }, "-=0.3")
              .from(".gsap-subtitle", { y: 15, opacity: 0, duration: 0.4 }, "-=0.3")
              .from(".gsap-photo", { scale: 0.8, opacity: 0, duration: 0.5, ease: "back.out(1.5)" }, "-=0.2")
              .from(".gsap-input", { y: 20, opacity: 0, stagger: 0.1, duration: 0.5, ease: "power2.out" }, "-=0.2")
              .from(".gsap-btn", { scale: 0.9, opacity: 0, duration: 0.4, ease: "back.out(1.5)" }, "-=0.2")
              .from(".gsap-footer", { opacity: 0, duration: 0.5 }, "-=0.2");
        }
    });

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            if (input.files[0].size > 500000) {
                alert("File is too large! Please upload an image under 500KB.");
                input.value = "";
                return;
            }
            reader.onload = function(e) {
                const preview = document.getElementById('photo-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('photo-placeholder').style.display = 'none';
                if(typeof gsap !== 'undefined') {
                    gsap.fromTo("#photo-circle", {scale: 0.8}, {scale: 1, duration: 0.4, ease: "back.out(2)"});
                }
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const photoInput = document.getElementById('reg-photo');
        const btn = document.getElementById('regBtn');
        const btnText = document.getElementById('btn-text');
        const errorMsg = document.getElementById('error-msg');

        try {
            btnText.innerText = "Processing...";
            btn.disabled = true;
            errorMsg.style.display = "none";
            
            let photoURL = "";
            if (photoInput.files[0]) {
                photoURL = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(photoInput.files[0]);
                });
            } else {
                photoURL = "https://ui-avatars.com/api/?name=" + encodeURIComponent(name) + "&background=random";
            }

            const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            await user.updateProfile({ displayName: name, photoURL: photoURL });

            await firebase.database().ref('users/' + user.uid).set({
                name: name,
                email: email,
                photo: photoURL,
                role: 'member',
                joined_at: new Date().toISOString()
            });

            btnText.innerText = "Success!";
            btn.style.background = "#10b981";
            setTimeout(() => { window.location.href = "/dashboard"; }, 1000);
            
        } catch (error) {
            btnText.innerText = "Create Account";
            btn.disabled = false;
            errorMsg.innerText = error.message;
            errorMsg.style.display = "block";
            if(typeof gsap !== 'undefined') {
                gsap.to("#register-container", { x: 10, duration: 0.08, yoyo: true, repeat: 5 });
            }
        }
    });
</script>

<style>
    /* ... (All your CSS from the original prompt) ... */
</style>

{% endblock %}
