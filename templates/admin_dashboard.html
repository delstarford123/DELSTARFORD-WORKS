{% extends 'base.html' %}
{% block content %}

<style>
    /* Hide public UI elements for the dashboard */
    .site-header, .site-footer { display: none !important; }
    body { background: #0f172a !important; color: #f8fafc; overflow: hidden; }

    /* Admin Layout */
    .admin-layout { display: flex; height: 100vh; width: 100vw; }
    
    /* Sidebar */
    .admin-sidebar { width: 280px; background: #020617; border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 30px 0; }
    .sidebar-brand { padding: 0 30px; margin-bottom: 40px; display: flex; align-items: center; gap: 15px; }
    .sidebar-brand img { height: 35px; }
    .sidebar-brand h2 { font-size: 1.2rem; font-weight: 800; margin: 0; letter-spacing: 1px; color: #3b82f6; }
    
    .admin-nav { display: flex; flex-direction: column; gap: 5px; padding: 0 15px; flex: 1; }
    .admin-nav-btn { background: transparent; border: none; color: #94a3b8; padding: 15px 20px; text-align: left; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; }
    .admin-nav-btn:hover { background: rgba(59, 130, 246, 0.1); color: #f8fafc; }
    .admin-nav-btn.active { background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37,99,235,0.3); }
    .admin-nav-btn i { font-size: 1.2rem; width: 20px; text-align: center; }

    .sidebar-footer { padding: 20px 30px; border-top: 1px solid #1e293b; }
    .logout-btn { color: #ef4444; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; display: flex; align-items: center; gap: 10px; }

    /* Main Content Area */
    .admin-main { flex: 1; overflow-y: auto; padding: 40px; background: #0f172a; position: relative; }
    .admin-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .admin-header-top h1 { font-size: 2rem; margin: 0; font-weight: 800; }
    .admin-profile { display: flex; align-items: center; gap: 15px; background: #1e293b; padding: 10px 20px; border-radius: 30px; border: 1px solid #334155; }
    .admin-profile img { width: 35px; height: 35px; border-radius: 50%; }

    /* Data Tables */
    .data-panel { display: none; animation: fadeIn 0.5s ease; }
    .data-panel.active { display: block; }
    
    .data-card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .data-card-header { padding: 20px 25px; border-bottom: 1px solid #334155; background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; }
    .data-card-header h3 { margin: 0; font-size: 1.2rem; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 15px 25px; border-bottom: 1px solid #334155; font-size: 0.95rem; }
    th { color: #94a3b8; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    tr:hover { background: rgba(255,255,255,0.02); }
    td { color: #e2e8f0; }
    
    .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .badge.admin { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid #3b82f6; }
    .badge.member { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .badge.high { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-brand">
            <img src="{{ url_for('static', filename='images/DEL SVG.svg') }}" alt="Logo">
            <h2>COMMAND</h2>
        </div>
        <nav class="admin-nav">
            <button class="admin-nav-btn active" onclick="switchTab('users-panel', this)">
                <i class="fas fa-users"></i> Network Users
            </button>
            <button class="admin-nav-btn" onclick="switchTab('tickets-panel', this)">
                <i class="fas fa-ticket-alt"></i> Support Tickets
            </button>
            <button class="admin-nav-btn" onclick="window.location.href='/'">
                <i class="fas fa-globe"></i> View Public Site
            </button>
        </nav>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="adminLogout()">
                <i class="fas fa-power-off"></i> Terminate Session
            </button>
        </div>
    </aside>

    <main class="admin-main">
        <div class="admin-header-top">
            <h1 id="panel-title">Network Users</h1>
            <div class="admin-profile">
                <span id="admin-name" style="font-weight: bold; font-size: 0.9rem;">Loading...</span>
                <i class="fas fa-user-shield" style="color: #3b82f6;"></i>
            </div>
        </div>

        <div id="users-panel" class="data-panel active">
            <div class="data-card">
                <div class="data-card-header">
                    <h3>Registered Accounts</h3>
                    <button onclick="loadUsers()" style="background: none; border: none; color: #3b82f6; cursor: pointer;"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined Date</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="5" style="text-align:center; color:#64748b;">Fetching network data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tickets-panel" class="data-panel">
            <div class="data-card">
                <div class="data-card-header">
                    <h3>Active Support Tickets</h3>
                    <button onclick="loadTickets()" style="background: none; border: none; color: #3b82f6; cursor: pointer;"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Client Name</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Subject</th>
                        </tr>
                    </thead>
                    <tbody id="tickets-table-body">
                        <tr><td colspan="5" style="text-align:center; color:#64748b;">Fetching ticket data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    // Tab Switching Logic
    function switchTab(panelId, btnElement) {
        document.querySelectorAll('.data-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(panelId).classList.add('active');
        btnElement.classList.add('active');
        
        document.getElementById('panel-title').innerText = btnElement.innerText;

        if(panelId === 'users-panel') loadUsers();
        if(panelId === 'tickets-panel') loadTickets();
    }

    // Authenticate and Load Data on Startup
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            if (window.auth) {
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        // Verify Admin status again just in case
                        const snap = await firebase.database().ref('users/' + user.uid).once('value');
                        if (snap.val() && snap.val().role === 'admin') {
                            document.getElementById('admin-name').innerText = snap.val().name || "Administrator";
                            loadUsers(); // Load initial data
                        } else {
                            adminLogout(); // Kick out non-admins
                        }
                    } else {
                        window.location.href = '/admin-login';
                    }
                });
            }
        }, 800);
    });

    // Fetch Users from Firebase
    async function loadUsers() {
        const tbody = document.getElementById('users-table-body');
        try {
            const snapshot = await firebase.database().ref('users').once('value');
            const users = snapshot.val();
            tbody.innerHTML = "";

            if (users) {
                for (let uid in users) {
                    const u = users[uid];
                    const date = u.joined_at ? new Date(u.joined_at).toLocaleDateString() : 'Unknown';
                    const roleClass = u.role === 'admin' ? 'badge admin' : 'badge member';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-family:monospace; color:#64748b;">${uid.substring(0,8)}...</td>
                            <td style="font-weight:bold;">${u.name || 'N/A'}</td>
                            <td>${u.email}</td>
                            <td><span class="${roleClass}">${u.role || 'user'}</span></td>
                            <td>${date}</td>
                        </tr>
                    `;
                }
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No users found in database.</td></tr>`;
            }
        } catch (error) {
            console.error("Error loading users:", error);
            tbody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center;">Failed to load users. Permission denied or database error.</td></tr>`;
        }
    }

    // Fetch Tickets from Firebase
    async function loadTickets() {
        const tbody = document.getElementById('tickets-table-body');
        try {
            // Assumes your Python route saves tickets to a 'tickets' node in Firebase Realtime DB
            const snapshot = await firebase.database().ref('tickets').once('value');
            const tickets = snapshot.val();
            tbody.innerHTML = "";

            if (tickets) {
                for (let tid in tickets) {
                    const t = tickets[tid];
                    const prioClass = t.priority === 'high' || t.priority === 'critical' ? 'badge high' : 'badge member';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-family:monospace; color:#3b82f6;">#${tid.substring(0,6)}</td>
                            <td style="font-weight:bold;">${t.name}</td>
                            <td style="text-transform: capitalize;">${t.category}</td>
                            <td><span class="${prioClass}">${t.priority}</span></td>
                            <td>${t.subject}</td>
                        </tr>
                    `;
                }
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No active support tickets.</td></tr>`;
            }
        } catch (error) {
            console.error("Error loading tickets:", error);
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Make sure your Python /submit-ticket route saves data to the 'tickets' node in Firebase!</td></tr>`;
        }
    }

    function adminLogout() {
        if(window.auth) auth.signOut().then(() => { window.location.href = '/admin-login'; });
    }
</script>
{% endblock %}
