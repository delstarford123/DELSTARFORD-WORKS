{% extends 'base.html' %}
{% block content %}

<style>
    /* Hide public UI elements for the secure admin portal */
    .site-header, .site-footer { display: none !important; }
    
    /* Cyber/Terminal Theme */
    body { background: #020617 !important; overflow: hidden; }
    
    /* Hex Grid Background */
    body::before {
        content: ""; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
        background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px);
        background-size: 30px 30px; opacity: 0.5; z-index: -1;
    }

    .admin-auth-section { 
        min-height: 100vh; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px;
    }
    
    .admin-auth-card { 
        background: rgba(15, 23, 42, 0.85); 
        backdrop-filter: blur(20px); 
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(59, 130, 246, 0.3); 
        padding: 50px; 
        border-radius: 16px; 
        width: 100%; 
        max-width: 440px; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.1); 
        position: relative; 
        overflow: hidden;
    }

    /* Radar Scan Animation */
    .scanline {
        position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        background: rgba(59, 130, 246, 0.6); 
        box-shadow: 0 0 15px rgba(59, 130, 246, 1);
        animation: scan 3.5s linear infinite; 
        opacity: 0.7; 
        pointer-events: none;
    }
    @keyframes scan { 0% { top: -10px; } 100% { top: 110%; } }

    .admin-header { text-align: center; margin-bottom: 45px; }
    .shield-icon { 
        font-size: 3.5rem; 
        color: #3b82f6; 
        margin-bottom: 15px; 
        filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5)); 
    }
    .admin-header h2 { 
        color: #f8fafc; 
        font-size: 1.8rem; 
        margin: 0 0 8px; 
        font-weight: 800; 
        letter-spacing: 2px; 
        text-transform: uppercase; 
        font-family: 'Courier New', Courier, monospace; 
    }
    .admin-header p { 
        color: #ef4444; 
        font-size: 0.85rem; 
        font-family: 'Courier New', Courier, monospace; 
        letter-spacing: 1px; 
        margin: 0; 
        font-weight: 600;
    }
    
    .form-group { margin-bottom: 25px; }
    .form-group label { 
        display: block; 
        color: #94a3b8; 
        font-size: 0.75rem; 
        text-transform: uppercase; 
        letter-spacing: 1.5px; 
        margin-bottom: 8px; 
        font-weight: 700; 
    }
    
    .input-wrapper-dark { 
        display: flex; 
        align-items: center; 
        background: #020617; 
        border: 1px solid #1e293b; 
        border-radius: 8px; 
        padding: 0 15px; 
        transition: all 0.3s ease; 
    }
    .input-wrapper-dark:focus-within { 
        border-color: #3b82f6; 
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); 
    }
    .input-wrapper-dark i { color: #3b82f6; margin-right: 12px; font-size: 1.1rem;}
    
    .input-wrapper-dark input { 
        width: 100%; 
        background: transparent; 
        border: none; 
        padding: 16px 0; 
        color: #10b981; 
        font-size: 1.05rem; 
        outline: none; 
        font-family: 'Courier New', Courier, monospace; 
        letter-spacing: 1px; 
        caret-color: #3b82f6; /* Premium cursor color */
    }
    .input-wrapper-dark input::placeholder { color: #475569; letter-spacing: normal; }
    
    .btn-admin-submit { 
        width: 100%; 
        background: transparent; 
        border: 2px solid #3b82f6; 
        color: #3b82f6; 
        padding: 16px; 
        border-radius: 8px; 
        font-size: 1.05rem; 
        font-weight: 800; 
        text-transform: uppercase; 
        letter-spacing: 2px; 
        cursor: pointer; 
        transition: all 0.3s ease; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        position: relative; 
        overflow: hidden;
        margin-top: 35px;
    }
    .btn-admin-submit::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.4), transparent);
        transition: left 0.5s ease;
    }
    .btn-admin-submit:hover { 
        background: #3b82f6; 
        color: white; 
        box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); 
    }
    .btn-admin-submit:hover::before { left: 100%; }
    
    .btn-admin-submit:disabled { 
        border-color: #334155; 
        color: #475569; 
        cursor: not-allowed; 
        box-shadow: none; 
        background: rgba(255,255,255,0.02); 
    }
    
    .admin-error { 
        background: rgba(239, 68, 68, 0.1); 
        color: #ef4444; 
        border: 1px solid rgba(239, 68, 68, 0.3); 
        padding: 12px; 
        font-size: 0.85rem; 
        text-align: center; 
        margin-top: 20px; 
        display: none; 
        font-family: 'Courier New', Courier, monospace; 
        border-radius: 6px; 
    }
</style>

<section class="admin-auth-section">
    <div class="admin-auth-card gsap-admin-card">
        
        <div class="scanline"></div>

        <div class="admin-header">
            <i class="fas fa-shield-alt shield-icon"></i>
            <h2 id="admin-title">System Override</h2>
            <p class="fade-element">Authorized Personnel Only.</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group fade-element">
                <label>Admin ID (Email)</label>
                <div class="input-wrapper-dark">
                    <i class="fas fa-user-shield"></i>
                    <input type="email" id="admin-email" placeholder="admin@delstarford.com" required autofocus>
                </div>
            </div>

            <div class="form-group fade-element">
                <label>Passphrase</label>
                <div class="input-wrapper-dark">
                    <i class="fas fa-key"></i>
                    <input type="password" id="admin-password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-admin-submit fade-element" id="adminBtn">
                <span id="btn-text">Authenticate</span> 
                <i class="fas fa-fingerprint" style="margin-left: 10px;"></i>
            </button>
            
            <p id="error-msg" class="admin-error"></p>
        </form>
    </div>
</section>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(typeof gsap !== 'undefined') {
            const tl = gsap.timeline();
            
            tl.from(".gsap-admin-card", { scale: 0.95, y: 40, opacity: 0, duration: 0.8, ease: "power3.out" })
              .fromTo("#admin-title", { text: "" }, { text: { value: "SYSTEM OVERRIDE", chars: "█▓▒░XO!#" }, duration: 1.2, ease: "none" }, "-=0.4")
              .from(".fade-element", { y: 20, opacity: 0, stagger: 0.1, duration: 0.5, ease: "power2.out" }, "-=0.5");
              
            gsap.to(".shield-icon", { scale: 1.05, duration: 1.5, repeat: -1, yoyo: true, ease: "sine.inOut" });
        }
    });

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('admin-email').value;
        const password = document.getElementById('admin-password').value;
        const btnText = document.getElementById('btn-text');
        const btn = document.getElementById('adminBtn');
        const errorMsg = document.getElementById('error-msg');

        try {
            btnText.innerText = "Authenticating...";
            btn.disabled = true;
            errorMsg.style.display = "none";

            // 1. Authenticate
            const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
            const user = userCredential.user;

            // 2. Role Check
            const snapshot = await firebase.database().ref('users/' + user.uid).once('value');
            const userData = snapshot.val();

            if (userData && userData.role === 'admin') {
                btnText.innerText = "Access Granted";
                btn.style.background = "#10b981"; 
                btn.style.borderColor = "#10b981"; 
                btn.style.color = "white";
                
                // Success Ping Animation
                if(typeof gsap !== 'undefined') { gsap.to(".gsap-admin-card", { scale: 1.02, duration: 0.2, yoyo: true, repeat: 1 }); }
                
                setTimeout(() => { window.location.href = "/admin-dashboard"; }, 800);
            } else {
                await firebase.auth().signOut();
                throw new Error("Clearance Level Insufficient.");
            }
            
        } catch (error) {
            btnText.innerText = "Authenticate";
            btn.disabled = false;
            errorMsg.innerText = "[!] " + error.message;
            errorMsg.style.display = "block";
            
            // Shake on Failure
            if(typeof gsap !== 'undefined') { gsap.to(".gsap-admin-card", { x: 10, duration: 0.08, yoyo: true, repeat: 5, ease: "sine.inOut" }); }
        }
    });
</script>
{% endblock %}
