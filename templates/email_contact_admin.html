<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Web Inquiry - Delstarford Works</title>
    <style>
        /* Email-safe CSS Reset */
        body, table, td, div, p, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table, td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
        }

        /* Main Wrapper */
        .wrapper {
            width: 100%;
            background-color: #f1f5f9;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-top: 6px solid #3b82f6; /* Corporate Blue */
        }
        
        /* Header */
        .header {
            background: #0f172a; /* Deep Navy */
            padding: 35px 30px;
            text-align: center;
        }
        .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 150px;
            height: auto;
        }
        .header h2 {
            color: #ffffff;
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Content Area */
        .content {
            padding: 40px 35px;
        }
        .field {
            margin-bottom: 25px;
        }
        .label {
            font-size: 12px;
            color: #64748b;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }
        .value {
            font-size: 16px;
            color: #0f172a;
            font-weight: 700;
        }
        .value a {
            color: #2563eb;
            text-decoration: none;
        }
        
        /* Message Box (Terminal Style) */
        .message-box {
            background: #f8fafc;
            padding: 25px;
            border-left: 4px solid #3b82f6;
            border: 1px solid #e2e8f0;
            border-left-width: 4px;
            border-radius: 6px;
            margin-top: 10px;
            color: #334155;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap; /* Keeps formatting intact */
            font-family: 'Courier New', Courier, monospace;
        }

        /* Action Buttons */
        .action-row {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
        }
        .action-btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            margin: 0 5px 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .action-btn.secondary {
            background-color: #ffffff;
            color: #0f172a !important;
            border: 1px solid #cbd5e1;
        }

        /* Footer */
        .footer {
            background-color: #f8fafc;
            padding: 25px 30px;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        .footer a {
            color: #64748b;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <table class="container" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td class="header">
                    <img src="https://delstarfordworks.co.ke/static/images/DEL%20SVG.svg" alt="Delstarford Works" class="logo">
                    <h2>New Web Inquiry</h2>
                    <span class="badge">{{ timestamp }}</span>
                </td>
            </tr>

            <tr>
                <td class="content">
                    <div class="field">
                        <span class="label">Sender Identity</span>
                        <div class="value">{{ name }} &lt;<a href="mailto:{{ email }}">{{ email }}</a>&gt;</div>
                    </div>

                    <div class="field">
                        <span class="label">Inquiry Category</span>
                        <div class="value" style="color: #2563eb;">{{ subject }}</div>
                    </div>

                    <div class="field">
                        <span class="label">Transmitted Payload</span>
                        <div class="message-box">{{ message }}</div>
                    </div>

                    <div class="action-row">
                        <a href="mailto:{{ email }}?subject=Re: {{ subject }} - Delstarford Works" class="action-btn">
                            Direct Reply via Email
                        </a>
                        <br>
                        <a href="https://delstarfordworks.co.ke/admin-login" class="action-btn secondary">
                            Open Admin Console
                        </a>
                    </div>
                </td>
            </tr>

            <tr>
                <td class="footer">
                    Secure Notification from Delstarford Works Contact System<br>
                    &copy; 2026 <a href="https://delstarfordworks.co.ke">Delstarford Works</a>. All rights reserved.
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
