<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Support Ticket</title>
    <style>
        /* RESET & BASE */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; color: #334155; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f1f5f9; padding: 30px 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 5px solid #dc2626; } /* Red Border for Alert */

        /* HEADER */
        .header { background-color: #0f172a; padding: 20px; text-align: center; }
        .header h2 { color: white; margin: 10px 0 0 0; font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* CONTENT */
        .content { padding: 30px; }
        .ticket-id-box { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px; text-align: center; font-weight: bold; font-family: monospace; font-size: 16px; margin-bottom: 25px; border-radius: 4px; }
        
        .data-row { margin-bottom: 12px; font-size: 15px; }
        .label { font-weight: 700; color: #64748b; width: 100px; display: inline-block; }
        .value { color: #0f172a; font-weight: 500; }
        .priority-badge { background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; border: 1px solid #fca5a5; }

        /* MESSAGE BOX */
        .msg-label { display: block; margin-top: 25px; margin-bottom: 8px; font-weight: 700; color: #334155; }
        .msg-box { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; font-size: 14px; line-height: 1.6; color: #475569; }

        /* FOOTER */
        .footer { background-color: #f8fafc; padding: 15px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            
            <div class="header">
                <img src="https://delstarford-works.onrender.com/static/images/DEL SVG.svg" alt="Delstarford Works" width="100" style="display: block; margin: 0 auto;">
                <h2>Support Ticket Alert</h2>
            </div>

            <div class="content">
                <div class="ticket-id-box">
                    ID: {{ ticket_id }}
                </div>

                <div class="data-row">
                    <span class="label">Priority:</span>
                    <span class="priority-badge">{{ priority }}</span>
                </div>
                <div class="data-row">
                    <span class="label">Category:</span>
                    <span class="value">{{ category }}</span>
                </div>
                <div class="data-row">
                    <span class="label">User:</span>
                    <span class="value">{{ name }}</span>
                </div>
                <div class="data-row">
                    <span class="label">Email:</span>
                    <span class="value"><a href="mailto:{{ email }}" style="color: #2563eb; text-decoration: none;">{{ email }}</a></span>
                </div>

                <span class="msg-label">Subject: {{ subject }}</span>
                <div class="msg-box">
                    {{ message }}
                </div>
            </div>

            <div class="footer">
                <p>&copy; 2026 Delstarford Works System Notification</p>
                <p>Login to Firebase Console to manage this ticket.</p>
            </div>
        </div>
    </div>
</body>
</html>
