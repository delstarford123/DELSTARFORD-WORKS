<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background-color: #f1f5f9; padding: 40px 0; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        h1 { color: #0f172a; margin-bottom: 10px; }
        p { color: #475569; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://img.icons8.com/color/96/000000/checked-checkbox.png" alt="Success" width="64">
        <h1>Message Received!</h1>
        <p>Hello <strong>{{ name }}</strong>,</p>
        <p>Thanks for reaching out to Delstarford Works. We have received your inquiry and our team is reviewing it.</p>
        <p>You can expect a response within <strong>2-4 business hours</strong>.</p>
        
        <p style="margin-top: 30px; font-size: 14px; color: #94a3b8;">
            Urgent? <a href="https://wa.me/254707605751" style="color: #10b981; text-decoration: none;">Chat on WhatsApp</a>
        </p>
    </div>
</body>
</html>
