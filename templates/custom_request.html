<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="estimator-wrapper">
    <div class="estimator-box">
        
        <div class="est-header">
            <h3><i class="fas fa-calculator"></i> AI Investment Estimator</h3>
            <p>Calculate the projected cost for your custom engineering solution.</p>
        </div>

        <div class="est-body">
            
            <div class="input-group">
                <label class="input-label">Core Technology</label>
                <div class="select-wrapper">
                    <select id="modelType" onchange="updatePrice()">
                        <option value="bio" selected> Bioinformatics (Genetic/DNA Analysis)</option>
                        <option value="vision">Computer Vision (Agri-Scan/Medical)</option>
                        <option value="nlp">Natural Language (Chatbots/Research)</option>
                        <option value="tabular">Tabular Intelligence (Sales/Finance)</option>
                    </select>
                    <i class="fas fa-chevron-down select-arrow"></i>
                </div>
            </div>

            <div class="input-group">
                <div class="label-flex">
                    <label class="input-label">Dataset Size</label>
                    <span class="value-badge"><span id="sizeLabel">50,000</span> Records</span>
                </div>
                <div class="range-container">
                    <input type="range" id="dataSize" min="1000" max="1000000" step="1000" value="50000" oninput="updatePrice()">
                    <div class="range-labels">
                        <span>1k</span>
                        <span>1 Million</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">System Architecture</label>
                <div class="complexity-grid">
                    <label class="complexity-card">
                        <input type="radio" name="complexity" value="standard" checked onclick="updatePrice()">
                        <div class="card-content">
                            <div class="check-circle"><i class="fas fa-check"></i></div>
                            <span class="card-title">Standard</span>
                            <span class="card-desc">MVP & Prototypes</span>
                        </div>
                    </label>
                    
                    <label class="complexity-card">
                        <input type="radio" name="complexity" value="advanced" onclick="updatePrice()">
                        <div class="card-content">
                            <div class="check-circle"><i class="fas fa-check"></i></div>
                            <span class="card-title">Advanced</span>
                            <span class="card-desc">Production Grade</span>
                        </div>
                    </label>

                    <label class="complexity-card">
                        <input type="radio" name="complexity" value="enterprise" onclick="updatePrice()">
                        <div class="card-content">
                            <div class="check-circle"><i class="fas fa-check"></i></div>
                            <span class="card-title">Enterprise</span>
                            <span class="card-desc">Full Scale + API</span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="price-display-area">
                <span>Estimated Investment</span>
                <h2 id="totalPrice">KSH 0.00</h2>
                <div class="loader" id="priceLoader"></div>
            </div>

            <button class="btn-lock-quote" onclick="submitToFirebase()">
                <span>Lock in this Quote</span>
                <i class="fas fa-arrow-right"></i>
            </button>
            
            <p class="disclaimer">*Estimate subject to final technical review.</p>
        </div>
    </div>
</div>

<style>
    /* --- CSS STYLING --- */
    :root {
        --primary: #0f172a; /* Navy */
        --accent: #10b981;  /* Emerald */
        --bg-light: #f8fafc;
        --border: #e2e8f0;
    }

    .estimator-wrapper {
        display: flex;
        justify-content: center;
        padding: 20px 0;
    }

    .estimator-box {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        width: 100%;
        overflow: hidden;
        border: 1px solid rgba(0,0,0,0.05);
    }

    /* Header */
    .est-header {
        background: var(--primary);
        color: white;
        padding: 25px;
        text-align: center;
    }
    .est-header h3 { margin: 0; font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .est-header p { margin: 8px 0 0 0; color: #94a3b8; font-size: 0.9rem; }

    .est-body { padding: 30px; }

    /* Inputs */
    .input-group { margin-bottom: 25px; }
    .input-label { display: block; font-weight: 700; color: #334155; margin-bottom: 10px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Custom Select */
    .select-wrapper { position: relative; }
    select {
        width: 100%;
        padding: 14px 15px;
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        appearance: none;
        background: white;
        color: #334155;
        font-weight: 500;
        transition: 0.3s;
        cursor: pointer;
    }
    select:focus { border-color: var(--primary); outline: none; }
    .select-arrow { position: absolute; right: 15px; top: 18px; color: #64748b; pointer-events: none; }

    /* Range Slider */
    .label-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .value-badge { background: #ecfdf5; color: var(--accent); padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; border: 1px solid #a7f3d0; }
    
    input[type=range] {
        width: 100%;
        height: 6px;
        background: #e2e8f0;
        border-radius: 5px;
        outline: none;
        -webkit-appearance: none;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
        transition: 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
    .range-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }

    /* Complexity Cards (Radio Replacement) */
    .complexity-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .complexity-card { cursor: pointer; position: relative; }
    .complexity-card input { display: none; } /* Hide actual radio */
    
    .card-content {
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 15px 5px;
        text-align: center;
        transition: 0.3s;
        height: 100%;
        display: flex; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    
    .card-title { font-weight: 700; font-size: 0.9rem; color: #334155; display: block; }
    .card-desc { font-size: 0.75rem; color: #64748b; margin-top: 4px; display: block; }
    .check-circle { display: none; color: var(--primary); font-size: 1.2rem; margin-bottom: 5px; }

    /* Selected State */
    .complexity-card input:checked + .card-content {
        border-color: var(--primary);
        background: #f1f5f9;
        box-shadow: 0 4px 6px rgba(15, 23, 42, 0.1);
    }
    .complexity-card input:checked + .card-content .card-title { color: var(--primary); }
    .complexity-card input:checked + .card-content .check-circle { display: block; }

    /* Price Display */
    .price-display-area {
        background: #0f172a;
        color: white;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        margin-top: 30px;
        position: relative;
        overflow: hidden;
    }
    .price-display-area span { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .price-display-area h2 { margin: 5px 0 0 0; font-size: 2rem; color: var(--accent); }

    /* Button */
    .btn-lock-quote {
        width: 100%;
        background: var(--accent);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 700;
        margin-top: 20px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        transition: 0.3s;
    }
    .btn-lock-quote:hover { background: #059669; transform: translateY(-2px); }
    
    .disclaimer { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-top: 15px; font-style: italic; }

    /* Loader for price update */
    .loader {
        display: none;
        width: 20px; height: 20px;
        border: 2px solid #ffffff;
        border-top: 2px solid var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 10px auto;
    }

    @media (max-width: 600px) {
        .complexity-grid { grid-template-columns: 1fr; }
        .card-content { flex-direction: row; justify-content: space-between; padding: 15px; text-align: left; }
        .check-circle { margin-bottom: 0; margin-right: 10px; }
    }
</style>

<script>
// Keep existing logic but add UI polish
let debounceTimer;

async function updatePrice() {
    // 1. Show loading state
    const priceText = document.getElementById('totalPrice');
    const loader = document.getElementById('priceLoader');
    
    priceText.style.opacity = '0.5';
    // Optional: Show a spinner if you want
    
    const payload = {
        modelType: document.getElementById('modelType').value,
        dataSize: document.getElementById('dataSize').value,
        complexity: document.querySelector('input[name="complexity"]:checked').value
    };

    // Update Label UI
    document.getElementById('sizeLabel').innerText = Number(payload.dataSize).toLocaleString();

    // Debounce network requests (wait 300ms after user stops sliding)
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
        try {
            const response = await fetch('/calculate-estimate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            
            // Update Price with animation effect
            priceText.innerText = `KSH ${data.estimate.toLocaleString()}`;
            priceText.style.opacity = '1';
        } catch (error) {
            console.error(error);
            priceText.innerText = "Calc Error";
        }
    }, 200);
}

// Initial call
updatePrice();
</script>
