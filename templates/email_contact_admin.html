<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .header { border-bottom: 2px solid #2563eb; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #1e293b; margin: 0; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .field { margin-bottom: 15px; }
        .label { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .value { font-size: 16px; color: #334155; margin-top: 5px; }
        .message-box { background: #f1f5f9; padding: 15px; border-left: 4px solid #2563eb; border-radius: 4px; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 12px; color: #94a3b8; text-align: center; }
        .action-btn { display: inline-block; background: #2563eb; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 5px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Web Inquiry</h2>
            <span class="badge">{{ timestamp }}</span>
        </div>

        <div class="field">
            <div class="label">From</div>
            <div class="value"><strong>{{ name }}</strong> (<a href="mailto:{{ email }}">{{ email }}</a>)</div>
        </div>

        <div class="field">
            <div class="label">Category</div>
            <div class="value">{{ subject }}</div>
        </div>

        <div class="field">
            <div class="label">Message</div>
            <div class="message-box">
                {{ message }}
            </div>
        </div>

        <div style="text-align: center;">
            <a href="mailto:{{ email }}?subject=Re: {{ subject }} - Delstarford Works" class="action-btn">Reply via Email</a>
            <a href="tel:{{ phone }}" class="action-btn" style="background: #10b981; margin-left: 10px;">Call Client</a>
        </div>

        <div class="footer">
            Sent from Delstarford Contact Form System
        </div>
    </div>
</body>
</html>
